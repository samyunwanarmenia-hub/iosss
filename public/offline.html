<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline | MyApp</title>
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f7fcf7;
      color: #0f172a;
    }
    body {
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      max-width: 480px;
      padding: 24px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.07);
      border: 1px solid #e2e8f0;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      color: #1e293b;
    }
    p {
      margin: 8px 0;
      color: #475569;
      line-height: 1.5;
    }
    .hint {
      margin-top: 16px;
      font-size: 14px;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>The app is cached for offline viewing. Some content may be unavailable until you reconnect.</p>
    <p class="hint">We’ll retry automatically when your connection is back.</p>
  </div>
</body>
</html>
