name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build web
        run: pnpm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Ensure MainViewController exists
        run: |
          echo "=== Checking MainViewController.swift ==="
          
          # Create MainViewController if it doesn't exist
          if [ ! -f "ios/App/App/MainViewController.swift" ]; then
            echo "⚠️  MainViewController.swift not found - creating it..."
            cat > ios/App/App/MainViewController.swift << 'EOF'
import UIKit
import Capacitor
import WebKit

@objc(MainViewController)
class MainViewController: CAPBridgeViewController {
    override open func webViewConfiguration(for instanceConfiguration: InstanceConfiguration) -> WKWebViewConfiguration {
        let configuration = super.webViewConfiguration(for: instanceConfiguration)
        configuration.preferences.javaScriptEnabled = true
        configuration.preferences.javaScriptCanOpenWindowsAutomatically = true
        configuration.setValue(true, forKey: "allowFileAccessFromFileURLs")
        configuration.setValue(true, forKey: "allowUniversalAccessFromFileURLs")
        configuration.allowsInlineMediaPlayback = true
        configuration.suppressesIncrementalRendering = false
        return configuration
    }
    
    override open func webView(with frame: CGRect, configuration: WKWebViewConfiguration) -> WKWebView {
        let webView = super.webView(with: frame, configuration: configuration)
        webView.allowsBackForwardNavigationGestures = true
        webView.allowsLinkPreview = false
        return webView
    }
    
    func applyRuntimePreferences() {
        guard let webView = bridge?.webView else { return }
        webView.configuration.preferences.javaScriptEnabled = true
        webView.configuration.preferences.javaScriptCanOpenWindowsAutomatically = true
        webView.configuration.setValue(true, forKey: "allowFileAccessFromFileURLs")
        webView.configuration.setValue(true, forKey: "allowUniversalAccessFromFileURLs")
    }
    
    override open func viewDidLoad() {
        super.viewDidLoad()
        applyRuntimePreferences()
    }
}
EOF
            echo "✅ MainViewController.swift created"
          else
            echo "✅ MainViewController.swift exists"
          fi

      - name: Add MainViewController to Xcode project
        run: |
          echo "=== Adding MainViewController to Xcode project ==="
          
          # Install xcodeproj gem for manipulating Xcode projects
          sudo gem install xcodeproj
          
          # Ruby script to add the file to the project
          cat > add_file.rb << 'EOF'
require 'xcodeproj'

project_path = 'ios/App/App.xcodeproj'
project = Xcodeproj::Project.open(project_path)

# Find the App group
app_group = project.main_group.find_subpath('App', true)

# Check if MainViewController.swift is already in the project
file_exists = app_group.files.any? { |file| file.path == 'MainViewController.swift' }

unless file_exists
  puts "Adding MainViewController.swift to project..."
  
  # Add file reference
  file_ref = app_group.new_reference('MainViewController.swift')
  
  # Add to App target
  target = project.targets.find { |t| t.name == 'App' }
  if target
    target.add_file_references([file_ref])
    puts "MainViewController.swift added to target"
  else
    puts "App target not found"
  end
  
  # Save the project
  project.save
  puts "Project saved"
else
  puts "MainViewController.swift already in project"
end
EOF

          ruby add_file.rb

      - name: Install CocoaPods
        run: |
          if ! command -v pod &> /dev/null; then
            sudo gem install cocoapods
          fi
          pod --version

      - name: Install Pods
        working-directory: ios/App
        run: pod install

      - name: Verify project structure
        run: |
          echo "=== Verifying files ==="
          ls -la ios/App/App/*.swift || echo "No Swift files found"
          echo ""
          echo "=== Checking workspace ==="
          if [ ! -d "ios/App/App.xcworkspace" ]; then
            echo "❌ Error: App.xcworkspace not found!"
            exit 1
          fi
          echo "✅ Workspace found"

      - name: Disable code signing
        run: |
          sed -i.bak 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i.bak 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i.bak 's/CODE_SIGN_IDENTITY = "Apple Development";//g' ios/App/App.xcodeproj/project.pbxproj
          sed -i.bak 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/' ios/App/App.xcodeproj/project.pbxproj
          rm -f ios/App/App.xcodeproj/project.pbxproj.bak

      - name: Clean build cache
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          echo "✅ Cleaned Xcode derived data"

      - name: Build archive (unsigned)
        run: |
          mkdir -p build
          
          set -o pipefail
          
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive 2>&1 | tee build.log
          
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo ""
            echo "❌ Build failed with exit code: $BUILD_EXIT_CODE"
            echo ""
            echo "=== SWIFT COMPILATION ERRORS ==="
            grep "error:" build.log | head -30 || echo "No errors found"
            echo ""
            echo "=== Last 150 lines ==="
            tail -150 build.log
            exit 1
          fi
          
          echo "✅ Archive build completed successfully"

      - name: Verify archive structure
        run: |
          if [ ! -d "build/App.xcarchive/Products/Applications/App.app" ]; then
            echo "❌ App.app not found in archive"
            ls -la build/App.xcarchive/Products/Applications/ 2>/dev/null || echo "Applications directory missing"
            exit 1
          fi
          echo "✅ Archive structure verified"

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -qr App-unsigned.ipa Payload
          cd ..
          echo "✅ IPA created successfully"
          ls -lh build/App-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: build/App-unsigned.ipa
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          retention-days: 7

      - name: Show detailed errors (on failure)
        if: failure()
        run: |
          echo "=== DETAILED ERROR ANALYSIS ==="
          echo ""
          echo "=== All errors ==="
          grep "error:" build.log || echo "No errors"
          echo ""
          echo "=== Swift compilation issues ==="
          grep -i "cannot find.*in scope\|use of unresolved\|no such module" build.log | head -20 || echo "No import errors"
