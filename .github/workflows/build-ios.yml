name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          echo "📱 Xcode version:"
          xcodebuild -version
          echo ""
          echo "📦 Xcode path:"
          xcode-select -p
          echo ""
          echo "🔧 Available SDKs:"
          xcodebuild -showsdks

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build web
        run: pnpm run build

      - name: Sync Capacitor
        run: |
          npx cap sync ios
          echo "✅ Capacitor sync completed"

      - name: Install CocoaPods
        run: |
          if ! command -v pod &> /dev/null; then
            sudo gem install cocoapods
          fi
          pod --version

      - name: Install Pods
        working-directory: ios/App
        run: |
          pod install
          echo "✅ CocoaPods installed"

      - name: Verify workspace and scheme
        run: |
          if [ ! -d "ios/App/App.xcworkspace" ]; then
            echo "❌ Error: App.xcworkspace not found!"
            exit 1
          fi
          echo "✅ Workspace found"
          
          # Verify scheme exists
          if ! xcodebuild -workspace ios/App/App.xcworkspace -list | grep -q "App"; then
            echo "❌ Error: Scheme 'App' not found!"
            echo "Available schemes:"
            xcodebuild -workspace ios/App/App.xcworkspace -list
            exit 1
          fi
          echo "✅ Scheme 'App' verified"

      - name: Disable code signing
        run: |
          # Portable sed commands for macOS
          sed -i.bak 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i.bak 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i.bak 's/CODE_SIGN_IDENTITY = "Apple Development";//g' ios/App/App.xcodeproj/project.pbxproj
          sed -i.bak 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/' ios/App/App.xcodeproj/project.pbxproj
          rm -f ios/App/App.xcodeproj/project.pbxproj.bak

      - name: Clean build cache
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          echo "✅ Cleaned Xcode derived data"

      - name: Build archive (unsigned)
        run: |
          mkdir -p build
          
          echo "🔨 Starting Xcode build..."
          echo "Workspace: ios/App/App.xcworkspace"
          echo "Scheme: App"
          echo "Configuration: Release"
          
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -allowProvisioningUpdates \
            archive 2>&1 | tee build.log
          
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ Build failed with exit code: $BUILD_EXIT_CODE"
            echo ""
            echo "=== Error Summary ==="
            grep -i "error:" build.log | head -30 || echo "No explicit errors found"
            echo ""
            echo "=== Warnings Summary ==="
            grep -i "warning:" build.log | head -20 || echo "No warnings found"
            echo ""
            echo "=== Last 100 lines ==="
            tail -100 build.log
            exit 1
          fi
          
          echo "✅ Archive build completed successfully"

      - name: Verify archive structure
        run: |
          if [ ! -d "build/App.xcarchive/Products/Applications/App.app" ]; then
            echo "❌ App.app not found in archive"
            ls -la build/App.xcarchive/Products/Applications/ 2>/dev/null || echo "Applications directory missing"
            exit 1
          fi
          echo "✅ Archive structure verified"

      - name: Create IPA
        run: |
          echo "📦 Creating IPA file..."
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -qr App-unsigned.ipa Payload
          cd ..
          echo "✅ IPA created successfully"
          ls -lh build/App-unsigned.ipa
          echo ""
          echo "📊 IPA file size:"
          du -h build/App-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: build/App-unsigned.ipa
          retention-days: 30

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          retention-days: 7

      - name: Show detailed errors (on failure)
        if: failure()
        run: |
          echo "=== Full Error Analysis ==="
          echo ""
          echo "=== Compilation Errors ==="
          grep -i "error:" build.log | head -50 || echo "No errors found"
          echo ""
          echo "=== Build Failures ==="
          grep -i "failed" build.log | head -30 || echo "No failures found"
          echo ""
          echo "=== Full Build Log (last 200 lines) ==="
          tail -200 build.log