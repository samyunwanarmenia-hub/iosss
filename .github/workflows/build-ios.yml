name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build web
        run: pnpm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Ensure MainViewController exists
        run: |
          if [ ! -f "ios/App/App/MainViewController.swift" ]; then
            echo "Creating MainViewController.swift..."
            cat > ios/App/App/MainViewController.swift << 'SWIFTEOF'
          import UIKit
          import Capacitor
          import WebKit
          
          @objc(MainViewController)
          class MainViewController: CAPBridgeViewController {
              override open func webViewConfiguration(for instanceConfiguration: InstanceConfiguration) -> WKWebViewConfiguration {
                  let configuration = super.webViewConfiguration(for: instanceConfiguration)
                  configuration.preferences.javaScriptEnabled = true
                  configuration.preferences.javaScriptCanOpenWindowsAutomatically = true
                  configuration.setValue(true, forKey: "allowFileAccessFromFileURLs")
                  configuration.setValue(true, forKey: "allowUniversalAccessFromFileURLs")
                  configuration.allowsInlineMediaPlayback = true
                  configuration.suppressesIncrementalRendering = false
                  return configuration
              }
              
              override open func webView(with frame: CGRect, configuration: WKWebViewConfiguration) -> WKWebView {
                  let webView = super.webView(with: frame, configuration: configuration)
                  webView.allowsBackForwardNavigationGestures = true
                  webView.allowsLinkPreview = false
                  return webView
              }
              
              func applyRuntimePreferences() {
                  guard let webView = bridge?.webView else { return }
                  webView.configuration.preferences.javaScriptEnabled = true
                  webView.configuration.preferences.javaScriptCanOpenWindowsAutomatically = true
                  webView.configuration.setValue(true, forKey: "allowFileAccessFromFileURLs")
                  webView.configuration.setValue(true, forKey: "allowUniversalAccessFromFileURLs")
              }
              
              override open func viewDidLoad() {
                  super.viewDidLoad()
                  applyRuntimePreferences()
              }
          }
          SWIFTEOF
            echo "MainViewController.swift created"
          else
            echo "MainViewController.swift already exists"
          fi

      - name: Install CocoaPods
        run: |
          if ! command -v pod &> /dev/null; then
            sudo gem install cocoapods
          fi
          pod --version

      - name: Install Pods
        working-directory: ios/App
        run: pod install

      - name: Verify workspace
        run: |
          if [ ! -d "ios/App/App.xcworkspace" ]; then
            echo "Error: App.xcworkspace not found!"
            exit 1
          fi
          echo "Workspace found"

      - name: Disable code signing
        run: |
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";//g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/' ios/App/App.xcodeproj/project.pbxproj

      - name: Clean build cache
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Build archive
        run: |
          mkdir -p build
          
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive 2>&1 | tee build.log
          
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Build failed!"
            echo "=== Errors ==="
            grep "error:" build.log | head -30
            echo "=== Last 100 lines ==="
            tail -100 build.log
            exit 1
          fi

      - name: Verify archive
        run: |
          if [ ! -d "build/App.xcarchive/Products/Applications/App.app" ]; then
            echo "App.app not found!"
            exit 1
          fi

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -qr App-unsigned.ipa Payload
          cd ..
          ls -lh build/App-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: build/App-unsigned.ipa
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          retention-days: 7
