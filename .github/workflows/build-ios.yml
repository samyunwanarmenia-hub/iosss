name: Build iOS IPA

# Workflow to build unsigned iOS IPA file
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          echo "📱 Xcode version:"
          xcodebuild -version
          echo ""
          echo "📦 Xcode path:"
          xcode-select -p
          echo ""
          echo "🔧 Available SDKs:"
          xcodebuild -showsdks

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build web
        run: pnpm run build

      - name: Sync Capacitor
        run: |
          npx cap sync ios
          echo "✅ Capacitor sync completed"

      - name: Fix AppDelegate to remove MainViewController dependency
        run: |
          echo "Fixing AppDelegate.swift..."
          mkdir -p ios/App/App
          printf '%s\n' \
            'import UIKit' \
            'import Capacitor' \
            '' \
            '@UIApplicationMain' \
            'class AppDelegate: UIResponder, UIApplicationDelegate {' \
            '' \
            '    var window: UIWindow?' \
            '' \
            '    func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {' \
            '        return true' \
            '    }' \
            '' \
            '    func applicationWillResignActive(_ application: UIApplication) {' \
            '    }' \
            '' \
            '    func applicationDidEnterBackground(_ application: UIApplication) {' \
            '    }' \
            '' \
            '    func applicationWillEnterForeground(_ application: UIApplication) {' \
            '    }' \
            '' \
            '    func applicationDidBecomeActive(_ application: UIApplication) {' \
            '    }' \
            '' \
            '    func applicationWillTerminate(_ application: UIApplication) {' \
            '    }' \
            '' \
            '    func application(_ app: UIApplication, open url: URL, options: [UIApplication.OpenURLOptionsKey: Any] = [:]) -> Bool {' \
            '        return ApplicationDelegateProxy.shared.application(app, open: url, options: options)' \
            '    }' \
            '' \
            '    func application(_ application: UIApplication, continue userActivity: NSUserActivity, restorationHandler: @escaping ([UIUserActivityRestoring]?) -> Void) -> Bool {' \
            '        return ApplicationDelegateProxy.shared.application(application, continue: userActivity, restorationHandler: restorationHandler)' \
            '    }' \
            '}' > ios/App/App/AppDelegate.swift
          echo "AppDelegate.swift fixed"
          
      - name: Update Main.storyboard to use CAPBridgeViewController
        run: |
          echo "Updating Main.storyboard..."
          sed -i '' 's/customClass="MainViewController"/customClass="CAPBridgeViewController"/g' ios/App/App/Base.lproj/Main.storyboard || echo "Already using CAPBridgeViewController"

      - name: Install CocoaPods
        run: |
          if ! command -v pod &> /dev/null; then
            sudo gem install cocoapods
          fi
          pod --version

      - name: Install Pods
        working-directory: ios/App
        run: |
          pod install
          echo "✅ CocoaPods installed"

      - name: Verify workspace and scheme
        run: |
          if [ ! -d "ios/App/App.xcworkspace" ]; then
            echo "❌ Error: App.xcworkspace not found!"
            exit 1
          fi
          echo "✅ Workspace found"
          
          # Verify scheme exists
          if ! xcodebuild -workspace ios/App/App.xcworkspace -list | grep -q "App"; then
            echo "❌ Error: Scheme 'App' not found!"
            echo "Available schemes:"
            xcodebuild -workspace ios/App/App.xcworkspace -list
            exit 1
          fi
          echo "✅ Scheme 'App' verified"

      - name: Disable code signing
        run: |
          echo "Disabling code signing for unsigned build..."
          # Disable code signing in project.pbxproj
          sed -i.bak 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i.bak 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i.bak 's/CODE_SIGN_IDENTITY = "Apple Development";//g' ios/App/App.xcodeproj/project.pbxproj
          sed -i.bak 's/CODE_SIGN_IDENTITY = "Apple Distribution";//g' ios/App/App.xcodeproj/project.pbxproj
          sed -i.bak 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/' ios/App/App.xcodeproj/project.pbxproj
          sed -i.bak 's/PROVISIONING_PROFILE_SPECIFIER = .*;//g' ios/App/App.xcodeproj/project.pbxproj
          rm -f ios/App/App.xcodeproj/project.pbxproj.bak
          echo "✅ Code signing disabled"

      - name: Clean build cache
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          echo "✅ Cleaned Xcode derived data"

      - name: Build iOS app (unsigned)
        run: |
          mkdir -p build
          
          echo "🔨 Building iOS app (unsigned)..."
          echo "Workspace: ios/App/App.xcworkspace"
          echo "Scheme: App"
          echo "Configuration: Release"
          echo "SDK: iphoneos"
          echo ""
          
          # Build the app directly (not archive) to avoid signing requirements
          # Using -destination generic/platform=iOS for device build
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -derivedDataPath build/DerivedData \
            build 2>&1 | tee build.log
          
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ Build failed with exit code: $BUILD_EXIT_CODE"
            echo ""
            echo "=== Error Summary ==="
            grep -i "error:" build.log | head -30 || echo "No explicit errors found"
            echo ""
            echo "=== Warnings Summary ==="
            grep -i "warning:" build.log | head -20 || echo "No warnings found"
            echo ""
            echo "=== Last 100 lines ==="
            tail -100 build.log
            exit 1
          fi
          
          echo "✅ Build completed successfully"

      - name: Locate built app
        run: |
          echo "🔍 Locating built App.app..."
          # Try multiple locations where the app might be
          APP_PATH=""
          
          # Check DerivedData first
          APP_PATH=$(find build/DerivedData -name "App.app" -type d 2>/dev/null | head -1)
          
          # If not found, check build directory
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "App.app" -type d 2>/dev/null | head -1)
          fi
          
          # If still not found, check common Xcode build locations
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -type d 2>/dev/null | head -1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ App.app not found in build output"
            echo ""
            echo "Searching for any .app files..."
            find build -name "*.app" -type d 2>/dev/null || echo "No .app files found in build/"
            echo ""
            echo "Build log location: build.log"
            exit 1
          fi
          
          echo "✅ Found App.app at: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          ls -lh "$APP_PATH"
          echo ""
          echo "App bundle size:"
          du -sh "$APP_PATH"

      - name: Create IPA
        run: |
          echo "📦 Creating IPA file..."
          mkdir -p build/Payload
          
          # Copy the app to Payload directory
          cp -R "$APP_PATH" build/Payload/
          
          # Create IPA
          cd build
          zip -qr App-unsigned.ipa Payload
          cd ..
          
          echo "✅ IPA created successfully"
          ls -lh build/App-unsigned.ipa
          echo ""
          echo "📊 IPA file size:"
          du -h build/App-unsigned.ipa
          echo ""
          echo "📱 IPA file ready: build/App-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: build/App-unsigned.ipa
          retention-days: 30

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          retention-days: 7

      - name: Show detailed errors (on failure)
        if: failure()
        run: |
          echo "=== Full Error Analysis ==="
          echo ""
          echo "=== Compilation Errors ==="
          grep -i "error:" build.log | head -50 || echo "No errors found"
          echo ""
          echo "=== Build Failures ==="
          grep -i "failed" build.log | head -30 || echo "No failures found"
          echo ""
          echo "=== Full Build Log (last 200 lines) ==="
          tail -200 build.log
