name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build web
        run: pnpm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Fix AppDelegate to remove MainViewController dependency
        run: |
          echo "Fixing AppDelegate.swift..."
          cat > ios/App/App/AppDelegate.swift << 'SWIFTEOF'
import UIKit
import Capacitor

@UIApplicationMain
class AppDelegate: UIResponder, UIApplicationDelegate {

    var window: UIWindow?

    func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
        return true
    }

    func applicationWillResignActive(_ application: UIApplication) {
    }

    func applicationDidEnterBackground(_ application: UIApplication) {
    }

    func applicationWillEnterForeground(_ application: UIApplication) {
    }

    func applicationDidBecomeActive(_ application: UIApplication) {
    }

    func applicationWillTerminate(_ application: UIApplication) {
    }

    func application(_ app: UIApplication, open url: URL, options: [UIApplication.OpenURLOptionsKey: Any] = [:]) -> Bool {
        return ApplicationDelegateProxy.shared.application(app, open: url, options: options)
    }

    func application(_ application: UIApplication, continue userActivity: NSUserActivity, restorationHandler: @escaping ([UIUserActivityRestoring]?) -> Void) -> Bool {
        return ApplicationDelegateProxy.shared.application(application, continue: userActivity, restorationHandler: restorationHandler)
    }
}
SWIFTEOF
          echo "AppDelegate.swift fixed"
          
      - name: Update Main.storyboard to use CAPBridgeViewController
        run: |
          echo "Updating Main.storyboard..."
          sed -i '' 's/customClass="MainViewController"/customClass="CAPBridgeViewController"/g' ios/App/App/Base.lproj/Main.storyboard || echo "Already using CAPBridgeViewController"

      - name: Install CocoaPods
        run: |
          if ! command -v pod &> /dev/null; then
            sudo gem install cocoapods
          fi
          pod --version

      - name: Install Pods
        working-directory: ios/App
        run: pod install

      - name: Verify workspace
        run: |
          if [ ! -d "ios/App/App.xcworkspace" ]; then
            echo "Error: App.xcworkspace not found!"
            exit 1
          fi
          echo "Workspace found"

      - name: Disable code signing
        run: |
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";//g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/' ios/App/App.xcodeproj/project.pbxproj

      - name: Clean build cache
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Build archive
        run: |
          mkdir -p build
          
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive 2>&1 | tee build.log
          
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Build failed!"
            echo "=== Errors ==="
            grep "error:" build.log | head -30
            echo "=== Last 100 lines ==="
            tail -100 build.log
            exit 1
          fi

      - name: Verify archive
        run: |
          if [ ! -d "build/App.xcarchive/Products/Applications/App.app" ]; then
            echo "App.app not found!"
            exit 1
          fi

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -qr App-unsigned.ipa Payload
          cd ..
          ls -lh build/App-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: build/App-unsigned.ipa
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          retention-days: 7
